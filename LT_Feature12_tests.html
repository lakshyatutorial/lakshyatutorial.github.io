<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tests & Quizzes | Lakshya Tutorial</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:15px 18px;position:sticky;top:0;z-index:10}.wrap{max-width:900px;margin:auto;padding:0 16px}.brand{font-weight:800;font-size:20px}.back{display:inline-block;margin-top:7px;color:#3157d5;text-decoration:none;font-weight:700}.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:20px;padding:24px;margin:24px 0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input,.select{width:100%;padding:12px;border:1px solid #d8deea;border-radius:10px;font:inherit;background:#fff}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#3157d5;color:#fff}.btn.secondary{background:#eef2f7;color:#263247}.muted{color:#667085}.test-row{display:flex;justify-content:space-between;gap:14px;align-items:center}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#334a92;font-size:12px;font-weight:700;margin:3px}.question{padding:18px 0;border-top:1px solid #e5e7eb}.option{display:block;padding:11px;border:1px solid #d8deea;border-radius:10px;margin:8px 0;cursor:pointer}.option input{margin-right:8px}.timer{font-size:22px;font-weight:800;color:#b42318}.result{background:#eaf8ef;color:#176b3a;padding:16px;border-radius:12px}.error{background:#fff0f0;color:#a42626;padding:14px;border-radius:12px}.history-row{padding:12px 0;border-bottom:1px solid #edf0f4}@media(max-width:650px){.grid{grid-template-columns:1fr}.test-row{display:block}.test-row .btn{margin-top:10px}}
</style></head>
<body>
<header><div class="wrap"><div class="brand">Lakshya Tutorial</div><a class="back" href="index.html">← Home</a></div></header>
<main class="wrap">
<section class="hero"><h1 style="margin:0 0 7px">📝 Tests & Quizzes</h1><p style="margin:0;opacity:.9">Practice class-wise tests and get your score instantly.</p></section>
<section id="loading" class="card">Loading your tests...</section>
<section id="testListSection" class="card" style="display:none"><div class="grid"><div><label style="font-weight:700;display:block;margin-bottom:6px">Your class</label><select id="classSelect" class="select"><option value="">All available classes</option></select></div><div><label style="font-weight:700;display:block;margin-bottom:6px">Subject filter</label><select id="subjectSelect" class="select"><option value="">All subjects</option></select></div></div><div id="testList" style="margin-top:16px"></div></section>
<section id="testSection" class="card" style="display:none"></section>
<section id="historySection" class="card" style="display:none"><h2>My Test History</h2><div id="history"></div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,getDoc,addDoc,serverTimestamp,query,where}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"});
const auth=getAuth(app),db=getFirestore(app);let user=null,profile={},tests=[],active=null,timer=null,secondsLeft=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const niceDate=v=>{try{const d=v?.toDate?v.toDate():new Date(v);return d.toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch{return''}};
async function start(u){user=u;const ps=await getDoc(doc(db,'students',u.uid));profile=ps.exists()?ps.data():{};await loadTests();await loadHistory();}
async function loadTests(){
 try{const snap=await getDocs(query(collection(db,'tests'),where('published','==',true)));tests=snap.docs.map(d=>({id:d.id,...d.data()}));
  const cls=String(profile.classLevel??profile.class??''); const classes=[...new Set(tests.map(t=>String(t.classLevel??'')).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));
  const cs=document.getElementById('classSelect');cs.innerHTML='<option value="">All available classes</option>'+classes.map(x=>`<option value="${esc(x)}">Class ${esc(x)}</option>`).join('');if(cls&&classes.includes(cls))cs.value=cls;
  const ss=document.getElementById('subjectSelect');const subs=[...new Set(tests.map(t=>String(t.subject||'')).filter(Boolean))].sort();ss.innerHTML='<option value="">All subjects</option>'+subs.map(x=>`<option>${esc(x)}</option>`).join('');
  renderTests();document.getElementById('loading').style.display='none';document.getElementById('testListSection').style.display='block';document.getElementById('historySection').style.display='block';
 }catch(e){document.getElementById('loading').innerHTML='<div class="error">Could not load tests. Please try again later.</div>';}}
function renderTests(){const cls=document.getElementById('classSelect').value,sub=document.getElementById('subjectSelect').value;const rows=tests.filter(t=>(!cls||String(t.classLevel)===cls)&&(!sub||String(t.subject||'')===sub));const box=document.getElementById('testList');if(!rows.length){box.innerHTML='<p class="muted">No tests available for this selection yet.</p>';return;}box.innerHTML=rows.map(t=>`<div class="test-row" style="padding:15px 0;border-bottom:1px solid #edf0f4"><div><h3 style="margin:0 0 6px">${esc(t.title||'LT Test')}</h3><span class="pill">Class ${esc(t.classLevel||'All')}</span><span class="pill">${esc(t.subject||'')}</span><span class="pill">${esc(t.difficulty||'Medium')}</span><span class="pill">${Array.isArray(t.questions)?t.questions.length:0} questions</span>${Number(t.durationMinutes)>0?`<span class="pill">${esc(t.durationMinutes)} min</span>`:'<span class="pill">No timer</span>'}<div class="muted" style="margin-top:6px">${esc(t.chapter||'')}</div></div><button class="btn" data-start="${esc(t.id)}">Start Test</button></div>`).join('');box.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>openTest(b.dataset.start));}
async function openTest(id){active=tests.find(t=>t.id===id);if(!active)return;clearInterval(timer);const qs=Array.isArray(active.questions)?active.questions:[];if(!qs.length)return;const box=document.getElementById('testSection');box.style.display='block';box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0 0 5px">${esc(active.title)}</h2><div class="muted">Class ${esc(active.classLevel||'All')} · ${esc(active.subject||'')} · ${esc(active.chapter||'')}</div></div><div id="timer" class="timer">${Number(active.durationMinutes)>0?formatTime(Number(active.durationMinutes)*60):'No timer'}</div></div><form id="testForm" style="margin-top:12px">${qs.map((q,i)=>`<div class="question"><h3 style="margin:0 0 10px">${i+1}. ${esc(q.question)}</h3>${(q.options||[]).map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn" type="submit">Submit Test</button><button class="btn secondary" type="button" id="cancelTest" style="margin-left:8px">Cancel</button></form><div id="submitMsg"></div>`;document.getElementById('cancelTest').onclick=()=>{clearInterval(timer);box.style.display='none';active=null};document.getElementById('testForm').onsubmit=e=>{e.preventDefault();submitTest(false)};if(Number(active.durationMinutes)>0){secondsLeft=Number(active.durationMinutes)*60;timer=setInterval(()=>{secondsLeft--;document.getElementById('timer').textContent=formatTime(secondsLeft);if(secondsLeft<=0){clearInterval(timer);submitTest(true)}},1000);}box.scrollIntoView({behavior:'smooth',block:'start'});}
function formatTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
async function submitTest(auto){if(!active)return;const qs=active.questions||[],form=document.getElementById('testForm');let score=0,answered=0;qs.forEach((q,i)=>{const picked=form.querySelector(`input[name="q${i}"]:checked`);if(picked){answered++;if(Number(picked.value)===Number(q.answer))score++;}});clearInterval(timer);const percent=Math.round(score/qs.length*100);const msg=document.getElementById('submitMsg');msg.innerHTML=`<div class="result"><b>Test ${auto?'auto-submitted — time ended':'submitted'}.</b><br>Score: <b>${score}/${qs.length}</b> (${percent}%)<br>Answered: ${answered}/${qs.length}</div>`;try{await addDoc(collection(db,'testResults'),{uid:user.uid,studentId:profile.studentId||'',studentName:profile.name||user.email||'Student',testId:active.id,testTitle:active.title||'',classLevel:active.classLevel||'',subject:active.subject||'',score,total:qs.length,percentage:percent,answered,submittedAt:serverTimestamp()});await loadHistory();}catch(e){msg.innerHTML+=`<div class="error" style="margin-top:10px">Result could not be saved, but your score was ${score}/${qs.length} (${percent}%).</div>`;}form.querySelectorAll('input').forEach(x=>x.disabled=true);form.querySelector('button[type="submit"]').disabled=true;}
async function loadHistory(){try{const snap=await getDocs(query(collection(db,'testResults'),where('uid','==',user.uid)));const rows=snap.docs.map(d=>d.data()).sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0));const box=document.getElementById('history');if(!rows.length){box.innerHTML='<p class="muted">No test results yet.</p>';return;}box.innerHTML=rows.slice(0,20).map(x=>`<div class="history-row"><b>${esc(x.testTitle||'Test')}</b><br><span class="muted">${esc(x.subject||'')} · ${esc(x.classLevel||'')} · ${niceDate(x.submittedAt)}</span><br><b>${esc(x.score)}/${esc(x.total)}</b> (${esc(x.percentage)}%)</div>`).join('');}catch(e){document.getElementById('history').innerHTML='<p class="muted">No test history available.</p>';}}
document.getElementById('classSelect').onchange=renderTests;document.getElementById('subjectSelect').onchange=renderTests;onAuthStateChanged(auth,u=>{if(!u){location.href='index.html';return;}start(u)});
</script></body></html>
