<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Announcements | Lakshya Tutorial</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e5e9f2;padding:16px 18px;position:sticky;top:0;z-index:5}
.wrap{max-width:900px;margin:auto}.brand{font-size:22px;font-weight:800}.sub{color:#687386;margin-top:5px}
main{padding:24px 16px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 12px rgba(20,30,50,.04)}
.card h2{margin:12px 0 8px;font-size:19px}.card p{line-height:1.6;margin:0;color:#4d586a;white-space:pre-wrap}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:700}
.date{font-size:12px;color:#7b8492}.empty,.loading{background:#fff;border:1px dashed #ccd3df;border-radius:16px;padding:30px;text-align:center;color:#687386}
.nav{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap}.nav a{text-decoration:none;color:#3157d5;font-weight:700}
</style></head><body>
<header><div class="wrap"><div class="brand">LT · Announcements</div><div class="sub">Important messages from Lakshya Tutorial.</div>
<div class="nav"><a href="student-dashboard.html">Dashboard</a><a href="index.html">Home</a></div></div></header>
<main class="wrap"><div id="loading" class="loading">Loading...</div><div id="content"></div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, limit } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",
  authDomain: "lakshya-tutorial-8d4bf.firebaseapp.com",
  projectId: "lakshya-tutorial-8d4bf",
  storageBucket: "lakshya-tutorial-8d4bf.firebasestorage.app",
  messagingSenderId: "1022368652605",
  appId: "1:1022368652605:web:9a170b155cfc4fb07bb954"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const niceDate=ts=>{try{const d=ts?.toDate?ts.toDate():new Date(ts);return d.toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"})}catch{return""}};

function render(items){
 const box=document.getElementById("content");
 if(!items.length){box.innerHTML='<div class="empty">No announcements yet.</div>';return;}
 box.innerHTML=items.map(n=>`
      <article class="card">
        <div class="row"><span class="badge">${esc(n.category || "Announcement")}</span><span class="date">${niceDate(n.createdAt)}</span></div>
        <h2>${esc(n.title || "Announcement")}</h2>
        <p>${esc(n.message || n.body || "")}</p>
      </article>`).join("");
}

onAuthStateChanged(auth,async user=>{
 if(!user){location.href="index.html";return;}
 document.getElementById("loading").style.display="none";
 try{
   const snap=await getDocs(query(collection(db,"announcements"),limit(50)));
   const items=snap.docs.map(d=>({id:d.id,...d.data()}))
     .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
   render(items);
 }catch(e){
   document.getElementById("content").innerHTML='<div class="empty">Could not load updates right now.</div>';
 }
});
</script></body></html>
