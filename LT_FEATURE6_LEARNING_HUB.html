<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Hub | Lakshya Tutorial</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#102a56;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:18px}.hero,.card{background:white;border-radius:16px;padding:18px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#123d7a,#2167c7);color:white}.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.subject{padding:12px;border:1px solid #ccd5e5;border-radius:10px;background:white}.active{background:#eaf2ff}.material{border:1px solid #dde3ec;border-radius:12px;padding:14px;margin-top:10px}.open{background:#165dcc;color:white;padding:8px 12px;border-radius:8px;text-decoration:none}select,input{width:100%;padding:11px;border:1px solid #ccd5e5;border-radius:9px;font-size:15px}</style></head><body><header><b>Lakshya Tutorial</b>　<a href="student-dashboard.html" style="color:white">Dashboard</a></header><main><section class="hero"><h1>Student Learning Hub</h1><p id="student">Loading...</p><span id="badge">Class: —</span></section><section class="card"><h2>My Class</h2><select id="cls"></select></section><section class="card"><h2>Subjects</h2><div class="subjects" id="subs"></div></section><section class="card"><h2>Study Materials</h2><input id="search" placeholder="Search chapter or material"><div id="materials">Choose a subject.</div></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs,updateDoc}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"}),auth=getAuth(app),db=getFirestore(app);
const cls=document.getElementById("cls"),subs=document.getElementById("subs"),box=document.getElementById("materials"),search=document.getElementById("search"),student=document.getElementById("student"),badge=document.getElementById("badge");
const subjects={1:["English","Mathematics","Environmental Studies"],2:["English","Mathematics","Environmental Studies"],3:["English","Mathematics","Science","Social Studies"],4:["English","Mathematics","Science","Social Studies"],5:["English","Mathematics","Science","Social Studies"],6:["English","Mathematics","Science","Social Science","Hindi"],7:["English","Mathematics","Science","Social Science","Hindi"],8:["English","Mathematics","Science","Social Science","Hindi"],9:["English","Mathematics","Science","Social Science","Hindi"],10:["English","Mathematics","Science","Social Science","Hindi"],11:["Physics","Chemistry","Biology","Mathematics","English"],12:["Physics","Chemistry","Biology","Mathematics","English"]};
let user,level="",subject="",materials=[];
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showSubjects(){let a=subjects[level]||["Mathematics","Science","English"];subs.innerHTML=a.map((s,i)=>`<button class="subject ${i?"":"active"}">${s}</button>`).join("");document.querySelectorAll(".subject").forEach((b,i)=>b.onclick=()=>{document.querySelectorAll(".subject").forEach(x=>x.classList.remove("active"));b.classList.add("active");subject=a[i];render()});subject=a[0]||"";render()}
function render(){let q=search.value.toLowerCase();let a=materials.filter(m=>String(m.classLevel??m.class??m.targetClass??"").replace(/^class\s*/i,"").toLowerCase()===String(level).toLowerCase()&&String(m.subject??"").toLowerCase()===subject.toLowerCase()&&[m.title,m.chapter,m.description,m.type].join(" ").toLowerCase().includes(q));box.innerHTML=a.length?a.map(m=>`<div class="material"><h3>${esc(m.title||"Untitled")}</h3><small>${esc(m.chapter||"Chapter")} • ${esc(m.type||"Resource")}</small><p>${esc(m.description||"")}</p>${m.url||m.link?`<a class="open" href="${esc(m.url||m.link)}" target="_blank">Open Material</a>`:""}</div>`).join(""):"<p>No published materials found for this subject and class yet.</p>"}
cls.innerHTML='<option value="">Select Class</option>'+Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join("");cls.onchange=async()=>{level=cls.value;badge.textContent="Class: "+(level||"—");if(user&&level)try{await updateDoc(doc(db,"students",user.uid),{classLevel:level})}catch(e){}showSubjects()};search.oninput=render;
onAuthStateChanged(auth,async u=>{if(!u){student.textContent="Please log in first.";return}user=u;let s=await getDoc(doc(db,"students",u.uid));let d=s.exists()?s.data():{};level=String(d.classLevel??d.class??"").replace(/^class\s*/i,"");student.textContent="Welcome, "+(d.name||u.email||"Student");badge.textContent="Class: "+(level||"Not selected");cls.value=level;let snap=await getDocs(collection(db,"materials"));materials=[];snap.forEach(x=>materials.push(x.data()));showSubjects()});
</script></body></html>
