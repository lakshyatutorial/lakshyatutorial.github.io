<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LT Profile</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:21px}.back,.action{border:0;border-radius:10px;padding:10px 15px;cursor:pointer}.back,.home{background:#eef2f7}.wrap{max-width:680px;margin:30px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:25px;box-shadow:0 8px 24px #0000000d}.avatar{width:96px;height:96px;border-radius:50%;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 14px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}h1{text-align:center;margin:8px 0 4px}.sub{text-align:center;color:#667085;margin-bottom:24px}.row{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #edf0f4}.label{color:#667085}.value{font-weight:600;text-align:right;word-break:break-word}.actions{display:flex;gap:10px;margin-top:24px}.logout{background:#fee4e2;color:#b42318}.note{margin-top:20px;padding:14px;border-radius:12px;background:#f8fafc;color:#475467;font-size:14px}@media(max-width:520px){.row{display:block}.value{text-align:left;margin-top:5px}.actions{flex-wrap:wrap}}</style></head>
<body><header><div class="brand">LT — Lakshya Tutorial</div><button class="back" id="back">← Home</button></header><main class="wrap"><section class="card"><div class="avatar" id="avatar">👤</div><h1 id="name">Loading...</h1><div class="sub">Student Profile</div><div class="row"><span class="label">Student ID</span><span class="value" id="studentId">Loading...</span></div><div class="row"><span class="label">Date of Birth</span><span class="value" id="dob">Loading...</span></div><div class="row"><span class="label">Email</span><span class="value" id="email">Loading...</span></div><div class="note"><b>Student ID</b><br>Your LT ID is your unique student identity. Your login email and password remain private account credentials.</div><div class="actions"><button class="action home" id="home">Back to Home</button><button class="action logout" id="logout">Logout</button></div><p id="msg"></p></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,collection,getDocs,query,where,runTransaction}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"});
const auth=getAuth(app),db=getFirestore(app);const go=()=>location.href="index.html";
const backBtn=document.getElementById("back");
const homeBtn=document.getElementById("home");
const logoutBtn=document.getElementById("logout");
const nameEl=document.getElementById("name");
const studentIdEl=document.getElementById("studentId");
const dobEl=document.getElementById("dob");
const emailEl=document.getElementById("email");
const avatarEl=document.getElementById("avatar");
const msgEl=document.getElementById("msg");
backBtn.onclick=go;
homeBtn.onclick=go;
logoutBtn.onclick=async()=>{await signOut(auth);go()};
onAuthStateChanged(auth,async u=>{if(!u)return go();try{
  const studentRef=doc(db,"students",u.uid);
  let snap=await getDoc(studentRef);
  let d;
  if(snap.exists()){
    d=snap.data();
  }else{
    // Repair an older account whose Auth record exists but profile is missing.
    const emailQuery=query(collection(db,"students"),where("email","==",u.email||""));
    const matches=await getDocs(emailQuery);
    if(!matches.empty){
      d={...matches.docs[0].data(),email:u.email||"",migratedToUid:u.uid};
    }else{
      d={name:u.displayName||"Student",dob:"",email:u.email||"",studentId:""};
    }
    await setDoc(studentRef,d,{merge:true});
  }
  // Assign a permanent LT ID. If LT-000001 is still unused, the next student
  // who needs an ID receives LT-000001. After that, numbering continues sequentially.
  if(!d.studentId){
    const firstIdCheck=await getDocs(query(collection(db,'students'),where('studentId','==','LT-000001')));
    const counterRef=doc(db,'counters','students');
    const giveFirstId=firstIdCheck.empty;
    await runTransaction(db,async t=>{
      const studentSnap=await t.get(studentRef);
      const studentData=studentSnap.exists()?studentSnap.data():{};
      if(studentData.studentId) return;
      const counterSnap=await t.get(counterRef);
      const currentNumber=counterSnap.exists()?(Number(counterSnap.data().lastNumber)||0):0;
      const next=giveFirstId?1:currentNumber+1;
      const newId='LT-'+String(next).padStart(6,'0');
      t.set(counterRef,{lastNumber:Math.max(currentNumber,next)},{merge:true});
      t.set(studentRef,{studentId:newId},{merge:true});
      d={...studentData,studentId:newId};
    });
  }
  nameEl.textContent=d.name||"Student";
  studentIdEl.textContent=d.studentId||"LT-ID pending";
  dobEl.textContent=d.dob||"Not provided";
  emailEl.textContent=d.email||u.email||"";
  if(d.photoUrl){avatarEl.innerHTML='<img src="'+String(d.photoUrl).replace(/"/g,"&quot;")+'">'}
}catch(e){msgEl.textContent="Could not load profile: "+e.message}});

async function ensureStudentId(uid){
  const studentRef=doc(db,'students',uid);
  const snap=await getDoc(studentRef);
  if(!snap.exists()) return '';
  const data=snap.data()||{};
  if(data.studentId && /^LT-\d{6}$/.test(data.studentId)) return data.studentId;

  // Read existing IDs once to establish a safe starting point. The counter
  // transaction then serializes simultaneous new-ID assignments.
  const all=await getDocs(collection(db,'students'));
  let observedMax=0;
  all.forEach(d=>{
    const id=String(d.data()?.studentId||'');
    const m=id.match(/^LT-(\d{6})$/);
    if(m) observedMax=Math.max(observedMax,Number(m[1]));
  });

  const counterRef=doc(db,'counters','students');
  let assigned='';
  await runTransaction(db,async t=>{
    const studentSnap=await t.get(studentRef);
    if(!studentSnap.exists()) return;
    const studentData=studentSnap.data()||{};
    if(studentData.studentId && /^LT-\d{6}$/.test(studentData.studentId)){
      assigned=studentData.studentId;
      return;
    }
    const counterSnap=await t.get(counterRef);
    const counterMax=counterSnap.exists()?(Number(counterSnap.data().lastNumber)||0):0;
    const next=Math.max(counterMax,observedMax)+1;
    assigned='LT-'+String(next).padStart(6,'0');
    t.set(counterRef,{lastNumber:next},{merge:true});
    t.set(studentRef,{studentId:assigned},{merge:true});
  });
  return assigned;
}

</script></body></html>
