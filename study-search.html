<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Search | Lakshya Tutorial</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{padding:16px 20px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}main{max-width:950px;margin:auto;padding:24px 16px}.hero{background:#2563eb;color:#fff;padding:25px;border-radius:18px;margin-bottom:18px}.box,.card,.empty{background:#fff;padding:16px;border-radius:15px;margin-bottom:14px}input,select{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #ccd3df;border-radius:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card h3{margin:8px 0}.meta{color:#64748b;font-size:13px}.open{display:inline-block;background:#2563eb;color:#fff;padding:9px 13px;border-radius:8px;text-decoration:none;font-weight:bold}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>Lakshya Tutorial</strong><a href="index.html">Home</a></header><main><section class="hero"><h1>Study Search</h1><p>Search class materials, subjects and chapters.</p></section><section class="box"><input id="s" placeholder="Search materials, subjects or chapters..."><div class="grid"><select id="t"><option value="">All Types</option><option value="pdf">PDF</option><option value="link">Link</option></select><select id="c"><option value="">All Classes</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div></section><div id="r" class="empty">Loading study materials...</div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyBZYc90TM1p9eXE56K6V-q1EZrpF_E1aD8",authDomain:"lakshya-tutorial-8d4bf.firebaseapp.com",projectId:"lakshya-tutorial-8d4bf",storageBucket:"lakshya-tutorial-8d4bf.firebasestorage.app",messagingSenderId:"1022368652605",appId:"1:1022368652605:web:9a170b155cfc4fb07bb954"}),db=getFirestore(app),s=document.getElementById("s"),t=document.getElementById("t"),c=document.getElementById("c"),r=document.getElementById("r");let a=[];const e=x=>String(x??"").replace(/[&<>"']/g,z=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[z]));function render(){let q=s.value.toLowerCase().trim(),v=t.value,k=c.value,l=a.filter(m=>(!q||[m.title,m.subject,m.chapter,m.description,m.class,m.type].join(" ").toLowerCase().includes(q))&&(!v||String(m.type||"").toLowerCase()==v)&&(!k||String(m.class||"")==k));r.innerHTML=l.length?l.map(m=>'<article class="card"><b>Class '+e(m.class||"—")+' · '+e(m.subject||"General")+'</b><h3>'+e(m.title||"Study Material")+'</h3><div class="meta">'+e(m.chapter||"General chapter")+' · '+e(m.type||"Link")+'</div><p>'+e(m.description||"Study material published by Lakshya Tutorial.")+'</p>'+(m.url?'<a class="open" target="_blank" rel="noopener" href="'+e(m.url)+'">Open Material →</a>':"")+'</article>').join(""):"<div class='empty'>No study material found.</div>"}async function load(){try{let x=await getDocs(query(collection(db,"materials"),where("published","==",true)));a=x.docs.map(d=>d.data());render()}catch(x){console.error(x);r.innerHTML="<div class='empty'>Unable to load materials right now.</div>"}}s.oninput=t.onchange=c.onchange=render;load();</script></body></html>
